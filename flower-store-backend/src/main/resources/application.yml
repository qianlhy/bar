  secret: flowerstore_secret_key_2024
  expiration: 604800000  # 7天，单位毫秒



# 文件上传配置
file:
  upload:
    path: ./uploads/  # 上传文件保存路径，相对路径以 jar 所在目录为基准（可用 APP_HOME 覆盖）
    static-pattern: /uploads/**  # 静态资源访问路径
    max-size: 10485760  # 最大文件大小，10MB
    domain: https://bar.twst.work  # 服务器域名（不含 /api），用于生成完整URL

# 订单通知配置
order:
  notification:
    enabled: true
    voice-enabled: true
    voice-text: "您有新的订单，请及时处理"

