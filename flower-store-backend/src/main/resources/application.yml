  appid: wx39c20690901c74e4
  secret: 01a5cbd9538ec5506e2229bb77805e9c
  # 微信支付（APIv3，公钥模式）
  pay:
    enabled: true
    mch-id: 1114313337                                              # 商户号
    api-v3-key: 82749105638201947536209481756302                    # APIv3密钥（32位）
    merchant-serial-no: 72C7A5E9DCAD0ADA70D24AFB31563D515F882BCC    # 商户证书序列号
    private-key-path: classpath:cert/apiclient_key.pem              # 商户API私钥
